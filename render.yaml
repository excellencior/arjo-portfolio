services:
  - type: web
    name: arjo-portfolio-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_PASS
        sync: false
    rootDir: server

  - type: static
    name: arjo-portfolio-ui
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    region: singapore
    envVars:
      - key: VITE_API_URL
        sync: false
    rootDir: client
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
